[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "money-mintter"
version = "0.1.0"
description = "Event-driven autonomous market analysis and paper-trading prototype."
requires-python = ">=3.12"
dependencies = []

[project.scripts]\nmm-backtest = "money_mintter.research.cli:main"\n\n[project.optional-dependencies]
dev = ["pytest>=8,<10"]
postgres = ["psycopg[binary]>=3.2,<4"]
calendars = ["exchange-calendars>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["money_mintter*"]
